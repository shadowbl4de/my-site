<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Старий Дуб</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Шапка сайту -->
        <header class="site-header">
            <h1 class="logo-title">Старий Дуб 🍃</h1>
            <p class="subtitle">ласкаво просимо</p>
        </header>

        <!-- Аватар профілю -->
        <div class="user-avatar">👤</div>

        <!-- Кнопки швидкої навігації -->
        <div class="menu-section">
            <a href="#vegetables" class="menu-btn">ОВОЧІ</a>
            <a href="#fruits" class="menu-btn">ФРУКТИ</a>
            <a href="#trees" class="menu-btn">ДЕРЕВА</a>
            <a href="#inventory" class="menu-btn">ІНВЕНТАР</a>
            <a href="#fertilizers" class="menu-btn">ДОБРИВА</a>
            <a href="#decor" class="menu-btn">ДЕКОР</a>
        </div>

        <!-- Секція: ОВОЧІ -->
        <section id="vegetables" class="products-section">
            <h2 class="section-title">ОВОЧІ</h2>
            <div class="products-grid">
                <div class="product-card">
                    <div class="product-img">🍅</div>
                    <span class="product-name">БУРЯК</span>
                </div>
                <div class="product-card">
                    <div class="product-img">🥬</div>
                    <span class="product-name">КАПУСТА</span>
                </div>
                <div class="product-card">
                    <div class="product-img">🥕</div>
                    <span class="product-name">МОРКВА</span>
                </div>
            </div>
        </section>

        <!-- Секція: ФРУКТИ -->
        <section id="fruits" class="products-section">
            <h2 class="section-
title">ФРУКТИ</h2>
            <div class="products-grid">
                <div class="product-card">
                    <div class="product-img">🍎</div>
                    <span class="product-name">ЯБЛУКО</span>
                </div>
                <div class="product-card">
                    <div class="product-img">🍐</div>
                    <span class="product-name">ГРУША</span>
                </div>
                <div class="product-card">
                    <div class="product-img">🍑</div>
                    <span class="product-name">ПЕРСИК</span>
                </div>
            </div>
        </section>

        <!-- Секція: ДЕРЕВА -->
        <section id="trees" class="products-section">
            <h2 class="section-title">ДЕРЕВА</h2>
            <div class="products-grid">
                <div class="product-card">
                    <div class="product-img">🌳</div>
                    <span class="product-name">ДУБ</span>
                </div>
                <div class="product-card">
                    <div class="product-img">🌲</div>
                    <span class="product-name">СОСНА</span>
                </div>
                <div class="product-card">
                    <div class="product-img">🌴</div>
                    <span class="product-name">ПАЛЬМА</span>
                </div>
            </div>
        </section>

    </div>

</body>
</html>
